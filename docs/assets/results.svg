<text x="30" y="434" font-size="12" fill="#8a8984">Each bar is a share of the statements in that group. Probity reads with Gemini and re-reads with Qwen where a rule fails; code decides. The others are each system doing the whole job.</text>
<text x="30" y="454" font-size="12" fill="#8a8984">Gemini is google/gemini-3.1-flash-lite and Qwen is qwen/qwen3.5-flash-02-23. Full results with intervals: docs/RESULTS.md.</text>
