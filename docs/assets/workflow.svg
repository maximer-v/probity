<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="600" viewBox="0 0 1240 600" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8a8984"/>
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#0b0b0b" flood-opacity="0.08"/>
    </filter>
  </defs>
  <rect width="1240" height="600" fill="#fcfcfb"/>

  <!-- 1 input -->
  <g transform="translate(30,40)">
    <rect width="265" height="270" rx="14" fill="#ffffff" stroke="#e8e7e3" filter="url(#shadow)"/>
    <rect width="265" height="6" rx="3" fill="#8a8984"/>
    <text x="20" y="40" font-size="12" fill="#8a8984" letter-spacing="1.5">1 · INPUT</text>
    <text x="20" y="66" font-size="18" font-weight="600" fill="#0b0b0b">Scanned statement</text>
    <text x="20" y="100" font-size="13" fill="#52514e">PDF, PNG, JPEG or TIFF</text>
    <text x="20" y="122" font-size="13" fill="#52514e">A scan or a phone photo</text>
    <text x="20" y="144" font-size="13" fill="#52514e">No text layer needed</text>
    <!-- page glyph -->
    <g transform="translate(20,168)">
      <rect width="62" height="80" rx="4" fill="#f4f3f0" stroke="#d9d8d3"/>
      <rect x="8" y="10" width="30" height="5" rx="2" fill="#c9c8c3"/>
      <g fill="#d9d8d3">
        <rect x="8" y="24" width="46" height="3" rx="1.5"/><rect x="8" y="32" width="46" height="3" rx="1.5"/>
        <rect x="8" y="40" width="46" height="3" rx="1.5"/><rect x="8" y="48" width="46" height="3" rx="1.5"/>
        <rect x="8" y="56" width="46" height="3" rx="1.5"/><rect x="8" y="64" width="46" height="3" rx="1.5"/>
      </g>
    </g>
    <text x="98" y="204" font-size="12" fill="#52514e">date · description</text>
    <text x="98" y="222" font-size="12" fill="#52514e">debit · credit · balance</text>
  </g>

  <!-- 2 read -->
  <g transform="translate(345,40)">
    <rect width="265" height="270" rx="14" fill="#ffffff" stroke="#e8e7e3" filter="url(#shadow)"/>
    <rect width="265" height="6" rx="3" fill="#2a78d6"/>
    <text x="20" y="40" font-size="12" fill="#8a8984" letter-spacing="1.5">2 · READ</text>
    <text x="20" y="66" font-size="18" font-weight="600" fill="#0b0b0b">Low-cost vision model</text>
    <text x="20" y="100" font-size="13" fill="#52514e">One page per call</text>
    <text x="20" y="122" font-size="13" fill="#52514e">Returns the characters it sees,</text>
    <text x="20" y="140" font-size="13" fill="#52514e">exactly as printed</text>
    <text x="20" y="172" font-size="13" fill="#52514e">It never adds anything up</text>
    <text x="20" y="194" font-size="13" fill="#52514e">It never says if it is right</text>
    <rect x="20" y="214" width="225" height="34" rx="8" fill="#eef4fc"/>
    <text x="32" y="236" font-size="12" fill="#1f5aa6">The model proposes. It does not decide.</text>
  </g>

  <!-- 3 check -->
  <g transform="translate(660,40)">
    <rect width="265" height="270" rx="14" fill="#ffffff" stroke="#e8e7e3" filter="url(#shadow)"/>
    <rect width="265" height="6" rx="3" fill="#6250d6"/>
    <text x="20" y="40" font-size="12" fill="#8a8984" letter-spacing="1.5">3 · CHECK</text>
    <text x="20" y="66" font-size="18" font-weight="600" fill="#0b0b0b">Rules, run as code</text>
    <text x="20" y="100" font-size="13" fill="#52514e">Exact arithmetic, no tolerance</text>
    <text x="20" y="122" font-size="13" fill="#52514e">Every row, not only the total</text>
    <rect x="20" y="140" width="225" height="52" rx="8" fill="#f3f1fd"/>
    <text x="32" y="162" font-size="12" font-family="ui-monospace, Menlo, Consolas, monospace" fill="#4536a8">balance = previous</text>
    <text x="32" y="180" font-size="12" font-family="ui-monospace, Menlo, Consolas, monospace" fill="#4536a8">        + credit − debit</text>
    <text x="20" y="218" font-size="13" fill="#52514e">A failure names the row</text>
    <text x="20" y="240" font-size="13" fill="#52514e">and the amount it is off by</text>
  </g>

  <!-- 4 revisit -->
  <g transform="translate(975,40)">
    <rect width="235" height="270" rx="14" fill="#ffffff" stroke="#e8e7e3" filter="url(#shadow)"/>
    <rect width="235" height="6" rx="3" fill="#eda100"/>
    <text x="20" y="40" font-size="12" fill="#8a8984" letter-spacing="1.5">4 · REVISIT</text>
    <text x="20" y="66" font-size="18" font-weight="600" fill="#0b0b0b">Second model, blind</text>
    <text x="20" y="100" font-size="13" fill="#52514e">A different model reads</text>
    <text x="20" y="118" font-size="13" fill="#52514e">only the page that failed</text>
    <text x="20" y="150" font-size="13" fill="#52514e">It sees nothing of the</text>
    <text x="20" y="168" font-size="13" fill="#52514e">first reading</text>
    <text x="20" y="200" font-size="13" fill="#52514e">Code compares the two</text>
    <text x="20" y="218" font-size="13" fill="#52514e">readings and re-runs</text>
    <text x="20" y="236" font-size="13" fill="#52514e">the rule</text>
  </g>

  <!-- arrows between stages -->
  <g stroke="#8a8984" stroke-width="1.6" fill="none">
    <line x1="298" y1="175" x2="341" y2="175" marker-end="url(#arrow)"/>
    <line x1="613" y1="175" x2="656" y2="175" marker-end="url(#arrow)"/>
    <line x1="928" y1="150" x2="971" y2="150" marker-end="url(#arrow)"/>
    <line x1="971" y1="205" x2="928" y2="205" marker-end="url(#arrow)"/>
  </g>
  <text x="950" y="139" font-size="10.5" fill="#8a8984" text-anchor="middle">fails</text>
  <text x="950" y="224" font-size="10.5" fill="#8a8984" text-anchor="middle">again</text>

  <!-- the rules conclude -->
  <g stroke="#8a8984" stroke-width="1.6" fill="none">
    <path d="M 792 313 L 792 346"/>
    <path d="M 216 346 L 1024 346"/>
    <line x1="216" y1="346" x2="216" y2="376" marker-end="url(#arrow)"/>
    <line x1="620" y1="346" x2="620" y2="376" marker-end="url(#arrow)"/>
    <line x1="1024" y1="346" x2="1024" y2="376" marker-end="url(#arrow)"/>
  </g>
  <text x="228" y="366" font-size="11" fill="#8a8984">every rule passes</text>
  <text x="632" y="366" font-size="11" fill="#8a8984">readers agree, rule still fails</text>
  <text x="1036" y="366" font-size="11" fill="#8a8984">readers differ, neither passes</text>

  <!-- outcomes -->
  <g transform="translate(30,380)">
    <rect width="372" height="104" rx="14" fill="#f0faf5" stroke="#bfe6d2"/>
    <circle cx="28" cy="32" r="7" fill="#1baf7a"/>
    <text x="46" y="38" font-size="16" font-weight="600" fill="#0e6b49">CONFIRMED</text>
    <text x="20" y="66" font-size="13" fill="#3d5a4d">Every rule passes on the final reading.</text>
    <text x="20" y="86" font-size="13" fill="#3d5a4d">Misreads were corrected and recorded.</text>
  </g>
  <g transform="translate(434,380)">
    <rect width="372" height="104" rx="14" fill="#fdf2f1" stroke="#f0c4c0"/>
    <circle cx="28" cy="32" r="7" fill="#d63a2f"/>
    <text x="46" y="38" font-size="16" font-weight="600" fill="#99231b">DOCUMENT INCONSISTENT</text>
    <text x="20" y="66" font-size="13" fill="#6b3b37">Two models and a third reading agree on</text>
    <text x="20" y="86" font-size="13" fill="#6b3b37">a row that breaks a rule. The row is named.</text>
  </g>
  <g transform="translate(838,380)">
    <rect width="372" height="104" rx="14" fill="#fff8e8" stroke="#f1dba6"/>
    <circle cx="28" cy="32" r="7" fill="#eda100"/>
    <text x="46" y="38" font-size="16" font-weight="600" fill="#8a5d00">UNRESOLVED</text>
    <text x="20" y="66" font-size="13" fill="#6b5a2e">The readers disagree and neither ties.</text>
    <text x="20" y="86" font-size="13" fill="#6b5a2e">Both readings go to a person.</text>
  </g>

  <!-- result strip -->
  <g transform="translate(30,512)">
    <rect width="1180" height="60" rx="14" fill="#ffffff" stroke="#e8e7e3"/>
    <text x="24" y="26" font-size="11" fill="#8a8984" letter-spacing="1.5">20 SCANNED STATEMENTS · TWO LOW-COST MODELS · SAME RESULT IN TWO INDEPENDENT RUNS</text>
    <text x="24" y="46" font-size="14" fill="#0b0b0b"><tspan font-weight="600">10 of 11</tspan> clean confirmed<tspan fill="#8a8984" dx="10">·</tspan><tspan dx="10"> </tspan><tspan font-weight="600">0 of 9</tspan> altered confirmed<tspan fill="#8a8984" dx="10">·</tspan><tspan dx="10"> </tspan><tspan font-weight="600">9 of 9</tspan> altered rows named<tspan fill="#8a8984" dx="10">·</tspan><tspan dx="10"> </tspan><tspan font-weight="600">65</tspan> misread rows corrected<tspan fill="#8a8984" dx="10">·</tspan><tspan dx="10"> </tspan>about <tspan font-weight="600">$0.05</tspan> per document</text>
  </g>
</svg>
